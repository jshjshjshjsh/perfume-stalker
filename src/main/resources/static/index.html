<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Stalker</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 50px 20px; }
        h1 { color: #bb86fc; }
        #scan-btn { background-color: #bb86fc; color: #000; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 30px; width: 100%; max-width: 300px;}
        #scan-btn:active { transform: scale(0.95); }
        #status { margin-top: 30px; padding: 15px; border-radius: 8px; background-color: #1e1e1e; word-break: break-all; min-height: 50px; }
    </style>
</head>
<body>

<h1>🐰 Perfume Stalker</h1>
<p>아침마다 스티커에 폰을 대세요</p>

<button id="scan-btn">NFC 스캔하기</button>
<div id="status">대기 중...</div>

<script>
    const scanBtn = document.getElementById('scan-btn');
    const statusDiv = document.getElementById('status');

    // 💡 팩트: 상태 관리를 위한 이중 락(Lock) 변수
    let isScanning = false;   // 스캐너 중복 실행 방지
    let isProcessing = false; // API 중복 호출 방지

    scanBtn.addEventListener('click', async () => {
        if (!("NDEFReader" in window)) {
            statusDiv.innerHTML = "❌ 안드로이드 크롬에서만 작동합니다.";
            return;
        }

        // 락 1: 이미 스캐너가 켜져 있으면 무시
        if (isScanning) {
            statusDiv.innerText = "📱 이미 스캔 대기 중입니다. 스티커를 대주세요!";
            return;
        }

        try {
            const ndef = new NDEFReader();
            await ndef.scan();
            isScanning = true; // 스캐너 켜짐 상태로 고정

            scanBtn.innerText = "스캔 대기 중...";
            scanBtn.style.backgroundColor = "#03dac6"; // UI 시각적 피드백
            statusDiv.innerText = "📱 폰을 향수 스티커에 가까이 대주세요...";

            ndef.onreading = async (event) => {
                // 락 2: 이미 서버로 API 쏘고 있으면 추가 스캔 무시 (바운싱 방지)
                if (isProcessing) return;
                isProcessing = true;

                const uid = event.serialNumber;
                statusDiv.innerText = `✅ 스캔 완료! UID: ${uid}\n서버로 전송 중...`;

                try {
                    // 백엔드와 같은 도메인이므로 상대 경로 사용
                    const response = await fetch("/api/v1/logs/scan", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ uid: uid })
                    });

                    const resultText = await response.text();

                    if (response.ok) {
                        statusDiv.innerHTML = `<span style="color:#03dac6;">${resultText}</span>`;
                    } else if (response.status === 400 && resultText.includes("Unregistered")) {
                        statusDiv.innerHTML = `<span style="color:#cf6679;">🐰 미등록 향수입니다.<br>등록 페이지로 이동해야 합니다.</span>`;
                    } else {
                        statusDiv.innerHTML = `<span style="color:#cf6679;">❌ 에러: ${resultText}</span>`;
                    }

                } catch (apiError) {
                    statusDiv.innerText = "❌ 서버와 통신할 수 없습니다.";
                } finally {
                    // API 통신이 끝나면 2초 뒤에 락을 풀어서 다음 향수 스캔을 준비함
                    setTimeout(() => {
                        isProcessing = false;
                        statusDiv.innerText = "📱 다음 향수를 스캔할 준비가 되었습니다.";
                    }, 2000);
                }
            };
        } catch (error) {
            statusDiv.innerText = `❌ NFC 스캔 에러: ${error}`;
            isScanning = false;
        }
    });
</script>
</body>
</html>
