plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.perfumestalker'
version = '0.0.1-SNAPSHOT'
description = 'api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. Core Web & API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 2. 비동기 통신 (Notion API 연동 핵심)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 3. 로컬 인메모리 캐시 (Notion API 호출 최소화)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // 4. K8s 모니터링 및 헬스체크 (Pond 2.0 Liveness/Readiness Probe 용도)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 5. 웹 크롤링 우회 (나중에 프래그런티카 뚫을 때 쓸 헤드리스 브라우저)
    implementation 'com.microsoft.playwright:playwright:1.41.0'
    implementation 'org.jsoup:jsoup:1.17.2'

    // 6. Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 7. Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test' // WebFlux 테스트용
}

tasks.named('test') {
    useJUnitPlatform()
}
