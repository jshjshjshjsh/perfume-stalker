services:
  perfume-backend:
    build: .
    container_name: perfume-stalker-api
    ports:
      - "53333:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: perfume-stalker-tunnel
    command: tunnel run
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    restart: unless-stopped
    depends_on:
      - perfume-backend